<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>BlinkBuy Marketplace — Buy & Sell in Malawi</title>
    <meta name="description" content="Malawi's local marketplace. Buy and sell electronics, clothing, food, furniture, phones and more across all districts." />
    <meta name="theme-color" content="#0a1628" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { overscroll-behavior: none; background: #0a1628; }
      #root { min-height: 100dvh; }
      body { opacity: 0; transition: opacity 0.15s; }
      body.loaded { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        requestAnimationFrame(() => document.body.classList.add('loaded'));
      });
    </script>
  </body>
</html>
